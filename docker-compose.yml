services:
  backend:
    image: tmquan3007/nexera-backend:latest
    container_name: nexera-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nexera-network

  frontend:
    image: tmquan3007/nexera-frontend:latest
    container_name: nexera-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://backend:4000}
      - JWT_SECRET=${JWT_SECRET:-default-secret-key-please-change-in-production}
    depends_on:
      - backend
    networks:
      - nexera-network

networks:
  nexera-network:
    driver: bridge
